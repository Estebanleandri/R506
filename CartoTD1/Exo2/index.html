<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercice 2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.mini-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #303030;
    padding: 10px 15px;
    border-radius: 4px;
    margin-bottom: 15px;
}
.mini-header a {
    color: white;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 12px;
}
.mini-header .logo {
    font-weight: bold;
    font-size: 14px;
}
#map { height: calc(100vh - 40px); width: 100%; }
</style>
</head>
<body>
<header class="mini-header">
    <a href="../../index.html" class="logo">R506 : Prog multimédia</a>
    <nav><a href="../../index.html">Accueil</a></nav>
</header>

<div id="map"></div>

<script>
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
});  //osm, OpenStreetMap

const stamen = L.tileLayer(
  'https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=eed6a6b4-d171-43e4-8215-e5f8490b4245', {
  maxZoom: 20,
  attribution: '&copy; Stadia Maps &copy; Stamen Design &copy; OpenStreetMap'
}); 

const nice = [43.7102, 7.2620];
const map = L.map('map', { center: nice, zoom: 12, layers: [osm] });

L.control.layers({ "OpenStreetMap": osm, "Stamen Toner": stamen }).addTo(map);

L.marker(nice).addTo(map).bindPopup("Nice (centre ville)");

L.polygon([
  [25.7617, -80.1918],
  [18.4655, -66.1057],
  [32.3078, -64.7505]
], { color: 'red' }).addTo(map).bindPopup("Triangle des Bermudes");

navigator.geolocation.getCurrentPosition(position => {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  const accuracy = position.coords.accuracy;

  map.setView([lat, lon]);
  L.marker([lat, lon]).addTo(map).bindPopup("Ma position").openPopup();
  L.circle([lat, lon], { radius: accuracy }).addTo(map);
});
</script>
</body>
</html>
